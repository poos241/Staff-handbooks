<svg xmlns="http://www.w3.org/2000/svg" width="620" height="980" viewBox="0 0 620 980" font-family="'gg sans','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a259f7"/>
    </marker>
    <style>
      .box { fill: #2b2d31; stroke: #a259f7; stroke-width: 2; rx: 12; }
      .box-alt { fill: #2b2d31; stroke: #5865f2; stroke-width: 2; rx: 12; }
      .box-warn { fill: #2b2d31; stroke: #f0b232; stroke-width: 2; rx: 12; }
      .title { fill: #ffffff; font-size: 17px; font-weight: 700; }
      .text { fill: #dbdee1; font-size: 14px; }
      .small { fill: #b5bac1; font-size: 12.5px; }
      .num { fill: #a259f7; font-size: 15px; font-weight: 800; }
      .line { stroke: #a259f7; stroke-width: 2.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="620" height="980" rx="16" fill="#1e1f22"/>

  <text x="310" y="44" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">Timeout Procedure</text>

  <!-- Step 1 -->
  <rect x="90" y="70" width="440" height="86" class="box" rx="12"/>
  <text x="120" y="102" class="num">1</text>
  <text x="145" y="102" class="title">Issue the timeout</text>
  <text x="145" y="128" class="text">Use the mod command with the</text>
  <text x="145" y="148" class="text">recommended duration + a reason.</text>

  <line x1="310" y1="156" x2="310" y2="186" class="line" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="90" y="186" width="440" height="86" class="box" rx="12"/>
  <text x="120" y="218" class="num">2</text>
  <text x="145" y="218" class="title">Open a ticket immediately</text>
  <text x="145" y="244" class="text">Open a ticket with the timed-out user</text>
  <text x="145" y="264" class="text">right away — don't wait.</text>

  <line x1="310" y1="272" x2="310" y2="302" class="line" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="90" y="302" width="440" height="86" class="box" rx="12"/>
  <text x="120" y="334" class="num">3</text>
  <text x="145" y="334" class="title">Inform the user</text>
  <text x="145" y="360" class="text">State the reason and exactly when</text>
  <text x="145" y="380" class="text">the timeout ends.</text>

  <line x1="310" y1="388" x2="310" y2="418" class="line" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="90" y="418" width="440" height="70" class="box-alt" rx="12"/>
  <text x="120" y="448" class="num" fill="#5865f2">4</text>
  <text x="145" y="448" class="title">Keep the ticket open</text>
  <text x="145" y="472" class="small">Leave it open for the full duration of the timeout.</text>

  <line x1="310" y1="488" x2="310" y2="518" class="line" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <rect x="90" y="518" width="440" height="110" class="box" rx="12"/>
  <text x="120" y="550" class="num">5</text>
  <text x="145" y="550" class="title">Timeout ends</text>
  <text x="145" y="576" class="text">Tell the user the timeout has ended.</text>
  <text x="145" y="600" class="text">Ask them to acknowledge the action and</text>
  <text x="145" y="620" class="text">confirm they understand the rules.</text>

  <!-- Branch -->
  <line x1="310" y1="628" x2="310" y2="658" class="line" marker-end="url(#arrow)"/>
  <polygon points="310,658 250,712 310,766 370,712" fill="#2b2d31" stroke="#a259f7" stroke-width="2"/>
  <text x="310" y="706" text-anchor="middle" class="title" font-size="15">User</text>
  <text x="310" y="728" text-anchor="middle" class="title" font-size="15">acknowledges?</text>

  <!-- Yes branch -->
  <line x1="250" y1="712" x2="130" y2="712" class="line" marker-end="url(#arrow)"/>
  <text x="185" y="704" text-anchor="middle" fill="#57f287" font-size="13" font-weight="700">YES</text>
  <rect x="30" y="668" width="200" height="88" class="box" rx="12" stroke="#57f287"/>
  <text x="130" y="702" text-anchor="middle" class="title" font-size="15">Close ticket</text>
  <text x="130" y="726" text-anchor="middle" class="small">with a clear reason</text>
  <text x="130" y="744" text-anchor="middle" class="small">for closing.</text>

  <!-- No branch -->
  <line x1="370" y1="712" x2="490" y2="712" class="line" marker-end="url(#arrow)"/>
  <text x="435" y="704" text-anchor="middle" fill="#ed4245" font-size="13" font-weight="700">NO</text>
  <rect x="390" y="668" width="200" height="88" class="box-warn" rx="12"/>
  <text x="490" y="702" text-anchor="middle" class="title" font-size="15">Escalate</text>
  <text x="490" y="726" text-anchor="middle" class="small">Follow the Ticket</text>
  <text x="490" y="744" text-anchor="middle" class="small">Acknowledgment procedure.</text>

  <!-- Footer -->
  <text x="310" y="820" text-anchor="middle" class="small">Always provide a reason with every mod command and ticket action.</text>
  <text x="310" y="850" text-anchor="middle" fill="#6d6f78" font-size="12">Little Haven — Moderation Handbook</text>
</svg>
